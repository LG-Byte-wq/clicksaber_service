<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>ClickSaber - v1.5</title>

<!-- Inclusão da biblioteca SheetJS -->
<script src="xlsx.full.min.js"></script>

<style>

:root {
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text-primary: #1f2937;
    --text-secondary: #4b5563;
    --border-color: #e5e7eb;
    --info-bg: #eef2ff;
    --info-text: #1e1b4b;
    --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

body.dark-theme {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
    --info-bg: #1e1b4b;
    --info-text: #e0e7ff;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

body{
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 30px;
    margin: 0;
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

.theme-toggle-container {
    max-width: 1000px;
    margin: 0 auto 10px auto;
    display: flex;
    justify-content: flex-end;
}

.theme-toggle {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
}

.theme-toggle:hover {
    background: var(--border-color);
}

.container{
    max-width: 1000px;
    margin: 0 auto;
    background: var(--card-bg);
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    transition: background 0.3s ease, box-shadow 0.3s ease;
    flex: 1;
}

h1{
    color: var(--text-primary);
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
    font-size: 2.2rem;
    letter-spacing: -0.5px;
}

p{
    color: var(--text-secondary);
    font-size: 1.05rem;
}

input[type="file"] {
    background: var(--bg);
    color: var(--text-primary);
    padding: 10px;
    border-radius: 8px;
    border: 1px dashed var(--border-color);
    width: 100%;
    box-sizing: border-box;
}

button{
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    transition: opacity 0.2s ease;
}

button:hover {
    opacity: 0.9;
}

.processar{
    background: #2563eb;
    font-size: 1rem;
}

.download{
    background: #059669;
}

.download2{
    background: #7c3aed;
}

.info{
    margin-top: 20px;
    padding: 15px;
    background: var(--info-bg);
    color: var(--info-text);
    border-radius: 8px;
    border-left: 4px solid #2563eb;
}

.erro{
    background: #fee2e2;
    color: #991b1b;
    border-left-color: #dc2626;
}

.sucesso{
    background: #dcfce7;
    color: #166534;
    border-left-color: #16a34a;
}

.botoes{
    margin-top: 20px;
}

.botoes button{
    margin-right: 10px;
}

footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 15px;
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 500;
}

</style>

</head>

<body>

<div class="theme-toggle-container">

    <button
        class="theme-toggle"
        onclick="alternarTema()"
    >

        <span id="theme-icon">🌙</span>

        <span id="theme-text">
            Modo Escuro
        </span>

    </button>

</div>


<div class="container">

    <h1>ClickSaber</h1>

    <p>
        Selecione o arquivo <b>CSV</b> ou <b>XLSX</b> recebido pelo time.
    </p>

    <input
        type="file"
        id="arquivo"
        accept=".csv,.xlsx,.xls"
    >

    <br><br>

    <button
        class="processar"
        onclick="processar()"
    >
        Processar Arquivo
    </button>

    <div
        id="status"
        class="info"
        style="display:none"
    ></div>

    <div
        class="botoes"
        id="downloads"
        style="display:none"
    >

        <button
            class="download"
            onclick="baixarCadastro()"
        >
            Baixar Cadastro
        </button>

        <button
            class="download2"
            onclick="baixarPersonalizacao()"
        >
            Baixar Personalização
        </button>

    </div>

</div>


<footer>
    Versão - v1.5
</footer>


<script>


/*
 * ==========================================================
 * VARIÁVEIS
 * ==========================================================
 */

let cadastroCSV = "";

let personalizacaoCSV = "";


/*
 * ==========================================================
 * CONTROLE DE TEMA
 * ==========================================================
 */

function alternarTema() {

    const body =
        document.body;

    const icon =
        document.getElementById("theme-icon");

    const text =
        document.getElementById("theme-text");


    body.classList.toggle("dark-theme");


    if (
        body.classList.contains("dark-theme")
    ) {

        icon.textContent = "☀️";

        text.textContent = "Modo Claro";

    } else {

        icon.textContent = "🌙";

        text.textContent = "Modo Escuro";

    }

}


/*
 * ==========================================================
 * MAPEAMENTO DOS SEGMENTOS
 * ==========================================================
 */

const MAPEAMENTO = {

    "Educação Infantil": [
        13,
        14,
        21,
        22,
        23
    ],

    "Ensino Fundamental 1": [
        1,
        11,
        3,
        5,
        6
    ],

    "Ensino Fundamental 2": [
        7,
        8,
        9,
        10
    ],

    "Ensino Médio": [
        2,
        12,
        4
    ]

};


/*
 * ==========================================================
 * IDS QUE NÃO PODEM SER GERADOS
 * ==========================================================
 */

const IDS_EXCLUIDOS = [

    17,
    18,
    37,
    38,
    39,
    40,
    41,
    43,
    47,
    48

];


/*
 * ==========================================================
 * EXIBIÇÃO DO STATUS
 * ==========================================================
 */

function status(
    msg,
    tipo = ""
){

    const div =
        document.getElementById("status");

    div.style.display = "block";

    div.className =
        "info " + tipo;

    div.innerHTML = msg;

}


/*
 * ==========================================================
 * TRATAMENTO DE CSV
 * ==========================================================
 *
 * Os dados são gravados como valores normais.
 *
 * Não utilizamos:
 *
 * ="00095105000000"
 *
 * Nem:
 *
 * '00095105000000
 */

function escaparCSV(valor){

    const texto =
        String(valor ?? "");


    if(
        texto.includes(";") ||
        texto.includes('"') ||
        texto.includes("\n") ||
        texto.includes("\r")
    ){

        return '"' +
            texto.replace(/"/g, '""') +
            '"';

    }


    return texto;

}


/*
 * ==========================================================
 * NORMALIZAÇÃO DE CODIGO_ESCOLA E CNPJ
 * ==========================================================
 *
 * Regras:
 *
 * 1. Remove caracteres que não sejam números.
 * 2. Campo vazio gera erro.
 * 3. Mais de 14 dígitos gera erro.
 * 4. Menos de 14 dígitos recebe zeros à esquerda.
 * 5. Resultado final possui exatamente 14 dígitos.
 */

function normalizarDocumento(
    valor,
    campo,
    linha
){

    let valorOriginal =
        String(valor ?? "")
        .trim();


    /*
     * Trata valores que possam ter vindo
     * como número decimal do Excel.
     */

    if(
        valorOriginal.endsWith(".0")
    ){

        valorOriginal =
            valorOriginal.slice(
                0,
                -2
            );

    }


    /*
     * Remove caracteres não numéricos.
     */

    const somenteNumeros =
        valorOriginal.replace(
            /\D/g,
            ""
        );


    /*
     * Campo vazio.
     */

    if(
        !somenteNumeros
    ){

        throw new Error(

            "Linha " +
            linha +
            ": " +
            campo +
            " não informado."

        );

    }


    /*
     * Mais de 14 dígitos.
     */

    if(
        somenteNumeros.length > 14
    ){

        throw new Error(

            "Linha " +
            linha +
            ": " +
            campo +
            " inválido. " +
            "O valor possui " +
            somenteNumeros.length +
            " dígitos. " +
            "O valor deve possuir exatamente 14 dígitos."

        );

    }


    /*
     * Completa zeros à esquerda.
     */

    const normalizado =
        somenteNumeros.padStart(
            14,
            "0"
        );


    /*
     * Validação final.
     */

    if(
        normalizado.length !== 14
    ){

        throw new Error(

            "Linha " +
            linha +
            ": " +
            campo +
            " inválido. " +
            "O valor final deve possuir exatamente 14 dígitos."

        );

    }


    return normalizado;

}


/*
 * ==========================================================
 * DOWNLOAD
 * ==========================================================
 */

function baixar(
    nome,
    conteudo
){

    const blob =
        new Blob(

            [conteudo],

            {
                type:
                    "text/csv;charset=ISO-8859-1"
            }

        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download = nome;


    document
        .body
        .appendChild(a);


    a.click();


    document
        .body
        .removeChild(a);


    URL.revokeObjectURL(url);

}


function baixarCadastro(){

    baixar(
        "Cadastro_Aplicacao.csv",
        cadastroCSV
    );

}


function baixarPersonalizacao(){

    baixar(
        "Personalizacao_ClickSaber.csv",
        personalizacaoCSV
    );

}


/*
 * ==========================================================
 * PROCESSAMENTO
 * ==========================================================
 */

function processar(){

    /*
     * Limpa resultados anteriores.
     */

    cadastroCSV = "";

    personalizacaoCSV = "";


    document
        .getElementById("downloads")
        .style.display = "none";


    /*
     * Arquivo selecionado.
     */

    const arquivo =
        document
        .getElementById("arquivo")
        .files[0];


    if(!arquivo){

        status(

            "<b>Erro:</b><br>" +
            "Selecione um arquivo CSV ou XLSX.",

            "erro"

        );

        return;

    }


    const reader =
        new FileReader();


    const ehExcel =
        arquivo.name
        .toLowerCase()
        .endsWith(".xlsx") ||

        arquivo.name
        .toLowerCase()
        .endsWith(".xls");


    reader.onload =
        function(e){

        try{

            let linhas = [];


            /*
             * ==================================================
             * LEITURA DO EXCEL
             * ==================================================
             */

            if(ehExcel){

                const workbook =
                    XLSX.read(

                        e.target.result,

                        {
                            type: "array"
                        }

                    );


                const nomeAba =
                    workbook
                    .SheetNames
                    .find(

                        nome =>

                            nome
                            .toLowerCase()
                            .includes(
                                "escolas para inclusão"
                            )

                    ) ||

                    workbook.SheetNames[0];


                const worksheet =
                    workbook.Sheets[nomeAba];


                linhas =
                    XLSX.utils.sheet_to_json(

                        worksheet,

                        {
                            header: 1,
                            raw: false,
                            defval: ""
                        }

                    );

            }


            /*
             * ==================================================
             * LEITURA DO CSV
             * ==================================================
             */

            else{

                const texto =
                    e.target.result;


                linhas =
                    texto
                    .split(/\r?\n/)
                    .filter(
                        x => x.trim() !== ""
                    )
                    .map(
                        x => x.split(";")
                    );

            }


            /*
             * ==================================================
             * VALIDAÇÃO DO ARQUIVO
             * ==================================================
             */

            if(
                linhas.length < 2
            ){

                throw new Error(

                    "O arquivo não possui dados para processamento."

                );

            }


            /*
             * ==================================================
             * CABEÇALHO
             * ==================================================
             */

            const header =
                linhas[0]
                .map(

                    x =>

                        String(x || "")
                        .replaceAll('"',"")
                        .trim()

                );


            /*
             * ==================================================
             * ÍNDICE DAS COLUNAS
             * ==================================================
             */

            const idx = {};


            header.forEach(
                (col, i) => {

                    idx[col] = i;

                }
            );


            /*
             * ==================================================
             * LOCALIZAR COLUNA DE SEGMENTOS
             * ==================================================
             */

            const segmentoColuna =
                Object.keys(idx)
                .find(

                    x =>

                        x
                        .toLowerCase()
                        .includes("clicksaber")

                );


            if(!segmentoColuna){

                throw new Error(

                    'Coluna de segmentos contendo "ClickSaber" não encontrada.'

                );

            }


            /*
             * ==================================================
             * COLUNAS OBRIGATÓRIAS
             * ==================================================
             */

            const colunasObrigatorias = [

                "CODIGO_ESCOLA",
                "NOME_ESCOLA",
                "CNPJ",
                "ENDERECO",
                "COMPLEMENTO",
                "BAIRRO",
                "NOME_MUNICIPIO",
                "ESTADO",
                "CODIGO_AGRUPAMENTO",
                "NOME_AGRUPAMENTO",
                "TIPO_AGRUPAMENTO",
                "ID_PESSOA_JURIDICA"

            ];


            const colunasAusentes =
                colunasObrigatorias.filter(

                    coluna =>

                        idx[coluna] === undefined

                );


            if(
                colunasAusentes.length > 0
            ){

                throw new Error(

                    "Colunas obrigatórias não encontradas: " +
                    colunasAusentes.join(", ")

                );

            }


            /*
             * ==================================================
             * CABEÇALHO DO CADASTRO
             * ==================================================
             */

            const cadastroHeader = [

                "CODIGO_ESCOLA",
                "NOME_ESCOLA",
                "CNPJ",
                "ENDERECO",
                "COMPLEMENTO",
                "BAIRRO",
                "NOME_MUNICIPIO",
                "ESTADO",
                "CODIGO_AGRUPAMENTO",
                "NOME_AGRUPAMENTO",
                "TIPO_AGRUPAMENTO",
                "ID_AGRUPAMENTO_PAI",
                "ID_APLICACAO_USUARIO",
                "ESCOLA_NAO_GERENCIAVEL",
                "PERMITE_RESPONSAVEL",
                "ORIUNDO_INTEGRACAO",
                "HABILITAR_MATERIAL_MANUALMENTE_NAS_TURMAS"

            ];


            const cadastro = [];


            cadastro.push(

                cadastroHeader
                .map(escaparCSV)
                .join(";")

            );


            /*
             * ==================================================
             * CABEÇALHO DA PERSONALIZAÇÃO
             * ==================================================
             */

            const personalizacao = [];


            personalizacao.push(

                [

                    "anoAdocao",
                    "idPessoaJuridica",
                    "idNivelEnsinoIndicacao",
                    "idColecao",
                    "sku",
                    "idServico",
                    "idTipoAdocao"

                ]
                .map(escaparCSV)
                .join(";")

            );


            /*
             * ==================================================
             * CONTADORES
             * ==================================================
             */

            let escolas = 0;


            let linhasPersonalizacao = 0;


            /*
             * ==================================================
             * CONTROLE DE DUPLICIDADE
             * ==================================================
             */

            const personalizacoesGeradas =
                new Set();


            /*
             * ==================================================
             * PROCESSAR CADA ESCOLA
             * ==================================================
             */

            for(
                let i = 1;
                i < linhas.length;
                i++
            ){

                const row =
                    linhas[i];


                const numeroLinha =
                    i + 1;


                /*
                 * Linha vazia.
                 *
                 * Pode ser ignorada.
                 */

                if(
                    !row ||
                    row.every(
                        valor =>
                            String(
                                valor ?? ""
                            ).trim() === ""
                    )
                ){

                    continue;

                }


                /*
                 * Validação da quantidade
                 * de colunas.
                 */

                if(
                    row.length < header.length
                ){

                    throw new Error(

                        "Linha " +
                        numeroLinha +
                        ": quantidade de colunas diferente do cabeçalho."

                    );

                }


                /*
                 * ==================================================
                 * CODIGO_ESCOLA
                 * ==================================================
                 */

                const codigo =
                    normalizarDocumento(

                        row[
                            idx["CODIGO_ESCOLA"]
                        ],

                        "CODIGO_ESCOLA",

                        numeroLinha

                    );


                /*
                 * ==================================================
                 * CNPJ
                 * ==================================================
                 */

                const cnpj =
                    normalizarDocumento(

                        row[
                            idx["CNPJ"]
                        ],

                        "CNPJ",

                        numeroLinha

                    );


                /*
                 * ==================================================
                 * ID PESSOA JURÍDICA
                 * ==================================================
                 */

                const idPessoa =
                    String(

                        row[
                            idx["ID_PESSOA_JURIDICA"]
                        ] || ""

                    ).trim();


                if(!idPessoa){

                    throw new Error(

                        "Linha " +
                        numeroLinha +
                        ": ID_PESSOA_JURIDICA não informado."

                    );

                }


                /*
                 * ==================================================
                 * SEGMENTOS
                 * ==================================================
                 */

                const segmentosValor =
                    row[
                        idx[segmentoColuna]
                    ] || "";


                const segmentos =
                    String(
                        segmentosValor
                    )
                    .split("|")
                    .map(
                        x => x.trim()
                    )
                    .filter(
                        x => x !== ""
                    );


                if(
                    segmentos.length === 0
                ){

                    throw new Error(

                        "Linha " +
                        numeroLinha +
                        ": nenhum segmento informado para o ClickSaber."

                    );

                }


                /*
                 * ==================================================
                 * CADASTRO DA APLICAÇÃO
                 * ==================================================
                 */

                cadastro.push(

                    [

                        /*
                         * Código já normalizado.
                         */

                        codigo,


                        row[
                            idx["NOME_ESCOLA"]
                        ] || "",


                        /*
                         * CNPJ já normalizado.
                         */

                        cnpj,


                        row[
                            idx["ENDERECO"]
                        ] || "",


                        row[
                            idx["COMPLEMENTO"]
                        ] || "",


                        row[
                            idx["BAIRRO"]
                        ] || "",


                        row[
                            idx["NOME_MUNICIPIO"]
                        ] || "",


                        row[
                            idx["ESTADO"]
                        ] || "",


                        row[
                            idx["CODIGO_AGRUPAMENTO"]
                        ] || "",


                        row[
                            idx["NOME_AGRUPAMENTO"]
                        ] || "",


                        row[
                            idx["TIPO_AGRUPAMENTO"]
                        ] || "",


                        /*
                         * ID_AGRUPAMENTO_PAI
                         */

                        "",


                        /*
                         * ID_APLICACAO_USUARIO
                         */

                        "360",


                        /*
                         * ESCOLA_NAO_GERENCIAVEL
                         */

                        "0",


                        /*
                         * PERMITE_RESPONSAVEL
                         */

                        "0",


                        /*
                         * ORIUNDO_INTEGRACAO
                         */

                        "1",


                        /*
                         * HABILITAR_MATERIAL_MANUALMENTE_NAS_TURMAS
                         */

                        "0"

                    ]
                    .map(escaparCSV)
                    .join(";")

                );


                escolas++;


                /*
                 * ==================================================
                 * EXPANSÃO DOS SEGMENTOS
                 * ==================================================
                 */

                segmentos.forEach(
                    seg => {


                    const niveis =
                        MAPEAMENTO[seg];


                    if(!niveis){

                        throw new Error(

                            "Linha " +
                            numeroLinha +
                            ": Segmento desconhecido: " +
                            seg

                        );

                    }


                    niveis.forEach(
                        nivel => {


                        /*
                         * ==================================================
                         * FILTRO DOS IDS EXCLUÍDOS
                         * ==================================================
                         */

                        if(
                            IDS_EXCLUIDOS.includes(
                                nivel
                            )
                        ){

                            return;

                        }


                        /*
                         * ==================================================
                         * CONTROLE DE DUPLICIDADE
                         * ==================================================
                         */

                        const chave =
                            idPessoa +
                            "_" +
                            nivel;


                        if(
                            personalizacoesGeradas.has(
                                chave
                            )
                        ){

                            return;

                        }


                        personalizacoesGeradas.add(
                            chave
                        );


                        /*
                         * ==================================================
                         * PERSONALIZAÇÃO
                         * ==================================================
                         */

                        personalizacao.push(

                            [

                                /*
                                 * anoAdocao
                                 */

                                "2026",


                                /*
                                 * idPessoaJuridica
                                 */

                                idPessoa,


                                /*
                                 * idNivelEnsinoIndicacao
                                 */

                                nivel,


                                /*
                                 * idColecao
                                 */

                                "",


                                /*
                                 * sku
                                 */

                                "",


                                /*
                                 * idServico
                                 */

                                "100",


                                /*
                                 * idTipoAdocao
                                 */

                                "6"

                            ]
                            .map(escaparCSV)
                            .join(";")

                        );


                        linhasPersonalizacao++;

                    });

                });

            }


            /*
             * ==================================================
             * GERA OS CSVs
             * ==================================================
             */

            cadastroCSV =
                cadastro.join("\n");


            personalizacaoCSV =
                personalizacao.join("\n");


            /*
             * ==================================================
             * LIBERA DOWNLOADS
             * ==================================================
             */

            document
                .getElementById("downloads")
                .style.display = "block";


            /*
             * ==================================================
             * STATUS DE SUCESSO
             * ==================================================
             */

            status(

                "<b>Processamento concluído com sucesso.</b><br><br>" +

                "Escolas processadas: " +
                escolas +

                "<br>" +

                "Linhas de cadastro: " +
                (cadastro.length - 1) +

                "<br>" +

                "Linhas de personalização: " +
                linhasPersonalizacao,

                "sucesso"

            );

        }


        catch(ex){

            /*
             * ==================================================
             * ERRO
             * ==================================================
             *
             * Descarta qualquer resultado parcial.
             */

            cadastroCSV = "";

            personalizacaoCSV = "";


            document
                .getElementById("downloads")
                .style.display = "none";


            status(

                "<b>Processamento interrompido.</b><br><br>" +

                ex.message +

                "<br><br>" +

                "Nenhum arquivo foi gerado para download.",

                "erro"

            );

        }

    };


    /*
     * ==========================================================
     * LEITURA DO ARQUIVO
     * ==========================================================
     */

    if(ehExcel){

        reader.readAsArrayBuffer(
            arquivo
        );

    } else {

        reader.readAsText(
            arquivo,
            "ISO-8859-1"
        );

    }

}


</script>

</body>

</html>
